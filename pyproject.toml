[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "syspop_v2"
version = "0.5.2"
authors = [
  { name="Sijin Zhang", email="zsjzyhzp@gmail.com" },
]
description = "Synthetic population generation via confidential nearest-neighbour aggregation and stochastic imputation"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "pyyaml",
    "pyarrow",
    "openpyxl",
    "graphviz"
]

[project.urls]
"Homepage" = "https://github.com/jzanetti/Syspop"
"Bug Tracker" = "https://github.com/jzanetti/Syspop/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["syspop*"]
exclude = ["examples*", "test*", "output*"]

[tool.setuptools.package-data]
"syspop" = ["config/*.yml", "data/*.yml"]
