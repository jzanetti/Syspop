# Configuration for Complex Multi-Feature Confidential Aggregation & Synthesis
# Individual features: age, sex, income, saving, occupation, location
# Hierarchy: individual -> family -> household

output_rules:
  rounding_base: 3 # Random rounding base for counts (3 for RR3, or null / 0 / false to switch off)
  leftover_action: "assign_nearest" # Leftover records after clustering: "assign_nearest" or "suppress"

  continuous:
    min_count: 20 # Minimum units per cluster (for continuous means, stds & cluster count)

  categorical:
    min_count: 6 # Minimum unweighted units per category cell inside each cluster

data_structure:
  hierarchy:
    - individual
    - family
    - household

  id_columns:
    individual: "person_id"
    family: "family_id"
    household: "household_id"

  # Sub-group member counts when rolling up from individual to family / household
  # (Total unit counts `individual_num` and `family_num` are always included automatically)
  hierarchy_counts:
    individual_under_18:
      condition: "age < 18"
      weight: 2.5
      levels: [family] # optional; omit to include both [family, household]

  features:
    location:
      type: "categorical"
      weight: 3.0
    age:
      type: "continuous"
      weight: 2.5
      agg: "mean" # Roll-up rule to family/household: "mean" (default), "sum", "min", "max", "median"
    income:
      type: "continuous"
      weight: 2.0
      agg: "sum" # Family/household income = sum of member incomes
    occupation:
      type: "categorical"
      weight: 1.5
    saving:
      type: "continuous"
      weight: 1.2
      agg: "sum" # Family/household saving = sum of member savings
    sex:
      type: "categorical"
      weight: 1.0

  # Optional cross-feature correlations/interactions added before clustering
  # to preserve joint relationships within nearest-neighbour clusters:
  correlations:
    - features: ["age", "income"]
      weight: 1.5
    - features: ["age", "sex"]
      weight: 1.0
    - features: ["sex", "income"]
      weight: 1.0

synthesis:
  reconcile_counts: "auto"
  random_seed: 42
