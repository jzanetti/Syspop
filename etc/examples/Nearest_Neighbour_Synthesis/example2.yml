# Configuration for Complex Multi-Feature Confidential Aggregation & Synthesis
# Individual features: age, sex, income, saving, occupation, location
# Hierarchy: individual -> family -> household

output_rules:
  min_group_count: 20          # Minimum units per cluster (for means & stds)
  min_cell_count: 6            # Minimum units per count / categorical cell
  rounding_base: 3             # Random rounding base (set to 3 for RR3, or null / 0 / false to switch off)
  # Small categorical cell (< min_cell_count) handling within a cluster:
  #   - "reassign_or_merge" (Option 1 - Default): Form compliant clusters and reassign/merge
  #       so every non-zero category in a released cluster has count >= min_cell_count
  #   - "suppress_cluster" (Option 2a): Suppress the entire cluster if any category has 0 < count < min_cell_count
  #   - "suppress_cell_nan" (Option 2b): Set only the small categorical proportion (< min_cell_count) to NaN
  #   - "rr3_and_suppress" (Option 3): Mask small categorical cells (< min_cell_count) to 0.0 and apply random rounding
  #   - "none": Raw proportions without adjustment
  subcell_action: "reassign_or_merge"
  leftover_action: "assign_nearest"

data_structure:
  hierarchy:
    - individual
    - family
    - household

  id_columns:
    individual: "person_id"
    family: "family_id"
    household: "household_id"

  # Sub-group member counts when rolling up from individual to family / household
  # (Total unit counts `individual_num` and `family_num` are always included automatically)
  hierarchy_counts:
    individual_under_18:
      condition: "age < 18"
      weight: 2.5

  features:
    location:
      type: "categorical"
      weight: 3.0
    age:
      type: "continuous"
      weight: 2.5
      agg: "mean"        # Roll-up rule to family/household: "mean" (default), "sum", "min", "max", "median"
    income:
      type: "continuous"
      weight: 2.0
      agg: "sum"         # Family/household income = sum of member incomes
    occupation:
      type: "categorical"
      weight: 1.5
    saving:
      type: "continuous"
      weight: 1.2
      agg: "sum"         # Family/household saving = sum of member savings
    sex:
      type: "categorical"
      weight: 1.0

synthesis:
  reconcile_counts: "auto"
  random_seed: 42
