# Sample Configuration for Nearest-Neighbour Confidential Aggregation & Synthesis
# Reference: etc/Synthetic_Data_Production_Algorithm.docx

output_rules:
  rounding_base: 3                     # Random rounding base for counts (e.g., 3 for RR3; set to null / 0 / false to turn off)
  leftover_action: "assign_nearest"    # Leftover records after clustering: "assign_nearest" or "suppress"

  continuous:
    min_count: 20                      # Minimum units per cluster (for continuous means, stds & cluster count)

  categorical:
    min_count: 6                       # Minimum unweighted units per category cell inside each cluster

data_structure:
  # Hierarchy levels from lowest (individual) to highest (household).
  # If omitted, automatically detected from the ID columns present in the DataFrame.
  hierarchy:
    - individual
    - family
    - household

  # Mapping of hierarchy level to ID column names in the unit-record dataset
  id_columns:
    individual: "person_id"
    family: "family_id"
    household: "household_id"

  # Optional sub-group member counts when rolling up to higher hierarchy levels (family / household)
  # (Total unit counts `individual_num` and `family_num` are always included automatically)
  # hierarchy_counts:
  #   individual_under_18:
  #     condition: "age < 18"
  #     weight: 2.0

  # Features configuration:
  # If omitted, all non-ID columns are automatically classified as "continuous" or "categorical"
  # with default weight 1.0 and default hierarchy roll-up `agg: "mean"`.
  # For continuous features, `agg` controls how values roll up to family/household ("mean", "sum", "min", "max", "median").
  features:
    age:
      type: "continuous"
      weight: 3.0
      agg: "mean"
    income:
      type: "continuous"
      weight: 1.0
      agg: "mean"
    sex:
      type: "categorical"
      weight: 1.0

synthesis:
  reconcile_counts: "auto"
  random_seed: 42
